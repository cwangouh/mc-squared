spring:
  application:
    name: formula-trainer
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/formula_trainer}
    username: ${DB_USERNAME:formula_trainer}
    password: ${DB_PASSWORD:formula_trainer}
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 12MB
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  servlet:
    session:
      timeout: 8h

app:
  media:
    storage-type: ${MEDIA_STORAGE_TYPE:local}
    storage-path: ${MEDIA_STORAGE_PATH:/var/lib/formula-trainer/media}
    max-size-bytes: 5242880
    max-width-px: 4096
    max-height-px: 4096
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
  security:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password-hash: ${ADMIN_PASSWORD_HASH:$2a$10$10iMR0mIACkXv7QUMnJ2iODWtxsBHWzNBc7thK4W2TtDWQsBXmhXK}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
app:
  media:
    storage-path: ${MEDIA_STORAGE_PATH:/tmp/formula-trainer-media-test}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
app:
  security:
    admin:
      username: ${ADMIN_USERNAME:}
      password-hash: ${ADMIN_PASSWORD_HASH:}
