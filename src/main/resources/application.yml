spring:
  application:
    name: formula-trainer
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/formula_trainer}
    username: ${DB_USERNAME:formula_trainer}
    password: ${DB_PASSWORD:formula_trainer}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  servlet:
    session:
      timeout: 8h

app:
  security:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password-hash: ${ADMIN_PASSWORD_HASH:$2a$10$10iMR0mIACkXv7QUMnJ2iODWtxsBHWzNBc7thK4W2TtDWQsBXmhXK}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
app:
  security:
    admin:
      username: ${ADMIN_USERNAME:}
      password-hash: ${ADMIN_PASSWORD_HASH:}
